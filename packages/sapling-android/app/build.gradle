import org.jetbrains.kotlin.gradle.dsl.ExplicitApiMode

plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'maven-publish'
    id 'org.mozilla.rust-android-gradle.rust-android'
}

android {
    compileSdk = 36
    ndkVersion = "29.0.14206865"

    defaultConfig {
        namespace "it.airgap.sapling"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "0.0.7"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(17)
        explicitApi(ExplicitApiMode.Warning)
    }

    cargo {
        module = '../../sapling'
        libname = 'libairgap_sapling'
        targets = ['arm', 'arm64', 'x86', 'x86_64']
        profile = 'release'
        prebuiltToolchains = true
        apiLevel = 29

         exec { spec, toolchain ->
             // Support 16KB page sizes
             // https://developer.android.com/guide/practices/page-sizes#other-build-systems
             spec.environment("RUST_ANDROID_GRADLE_CC_LINK_ARG", "-Wl,-z,max-page-size=16384,-soname,lib${libname}.so")
         }

        features {
            defaultAnd("c_bindings")
        }
    }
}

dependencies {

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'it.airgap'
                artifactId = 'sapling'
                version = android.defaultConfig.versionName
            }
        }
    }
}
